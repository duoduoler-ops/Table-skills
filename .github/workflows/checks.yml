name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Confirm PowerShell 7
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 required' }
      - name: Project handoff regression
        run: python -B -X utf8 tests/test_project_handoff.py
      - name: Claude Code adapter regression
        run: python -B -X utf8 tests/test_claude_hook.py
